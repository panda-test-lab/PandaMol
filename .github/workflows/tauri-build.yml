name: PandaMol Desktop and Mobile Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for this version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PandaMol $GITHUB_REF_NAME" \
              --notes "Desktop- und Mobil-Builds für PandaMol $GITHUB_REF_NAME." \
              --draft \
              --verify-tag
          fi

  build-desktop:
    name: Desktop update build on ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles msi,nsis,updater'
          - platform: ubuntu-latest
            target: ''
            args: '--bundles appimage,deb,updater'
          - platform: macos-15-intel
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --bundles app,dmg,updater'
          - platform: macos-15
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --bundles app,dmg,updater'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Verify updater signing key secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

      - name: Build and publish signed desktop update
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: PandaMol ${{ github.ref_name }}
          releaseBody: Desktop- und Mobil-Builds für PandaMol ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          retryAttempts: 5
          args: ${{ matrix.args }}

  build-android:
    name: Android build
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Android package
        env:
          TAURI_BUILD_FEATURES_FILE: 1
        run: |
          npm run tauri -- android init
          npm run tauri -- android build

      - name: Upload Android APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t apk_files < <(find src-tauri/gen/android -type f -name '*release*.apk' | sort)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "::error::No release APK was generated."
            exit 1
          fi
          for apk_file in "${apk_files[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$apk_file" --repo "$GITHUB_REPOSITORY" --clobber
          done

  build-ios:
    name: iOS simulator build
    needs: create-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust iOS simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm install

      - name: Build iOS simulator app
        env:
          TAURI_BUILD_FEATURES_FILE: 1
        run: |
          npm run tauri -- ios init
          npm run tauri -- ios build --target x86_64

      - name: Archive and upload iOS simulator build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -d src-tauri/gen/apple/build
          ditto -c -k --keepParent src-tauri/gen/apple/build PandaMol-iOS-Simulator.zip
          gh release upload "$GITHUB_REF_NAME" PandaMol-iOS-Simulator.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish complete release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after all platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH -F draft=false
